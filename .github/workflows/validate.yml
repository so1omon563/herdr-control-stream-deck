name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:marketplace
      - run: git diff --exit-code -- marketplace/exports
      - run: npm test
      - run: npm run validate:streamdeck
